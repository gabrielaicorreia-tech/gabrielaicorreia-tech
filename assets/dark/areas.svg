<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Áreas de interesse: Inteligência Artificial, Ciência de Dados, Desenvolvimento, Automação, Tecnologia e Educação, Pessoas e UX."><style>
.ink{fill:#F5EFFF} .muted{fill:#C9BEE6} .soft{fill:#8E82B0}
.sans{font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif} .mono{font-family:SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace} .serif{font-family:Georgia, 'Times New Roman', serif}
.twinkle{animation:tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.d1{animation-delay:.8s} .d2{animation-delay:1.6s} .d3{animation-delay:2.4s}
.spin{animation:sp 9s linear infinite;transform-box:fill-box;transform-origin:center}
.float{animation:fl 6s ease-in-out infinite}
.blink{animation:bl 1.1s steps(1) infinite}
.eq{animation:eq 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
@keyframes tw{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes bl{50%{opacity:0}}
@keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E0B1F"/><stop offset=".5" stop-color="#170D2A"/><stop offset="1" stop-color="#1C0F2E"/></linearGradient>
<linearGradient id="hl" x1="0" x2="1"><stop offset="0" stop-color="#FF4FB8"/><stop offset=".55" stop-color="#B57BFF"/><stop offset="1" stop-color="#4FF0D0"/></linearGradient>
<linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#E4D8FF"/><stop offset=".55" stop-color="#9C87D8"/><stop offset="1" stop-color="#F6E9FF"/></linearGradient>
<radialGradient id="b1"><stop offset="0" stop-color="#FF4FB8" stop-opacity=".75"/><stop offset="1" stop-color="#FF4FB8" stop-opacity="0"/></radialGradient>
<radialGradient id="b2"><stop offset="0" stop-color="#7B4DFF" stop-opacity=".7"/><stop offset="1" stop-color="#7B4DFF" stop-opacity="0"/></radialGradient>
<radialGradient id="b3"><stop offset="0" stop-color="#4FF0D0" stop-opacity=".55"/><stop offset="1" stop-color="#4FF0D0" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#B57BFF" stroke-opacity=".10"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
