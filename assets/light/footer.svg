<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="130" viewBox="0 0 1200 130" role="img" aria-label="Mesmos caminhos, novas possibilidades. People, data, purpose."><style>
.ink{fill:#2B1B3D} .muted{fill:#5B4A6E} .soft{fill:#8C7AA0}
.sans{font-family:'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif} .mono{font-family:SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace} .serif{font-family:Georgia, 'Times New Roman', serif}
.twinkle{animation:tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.d1{animation-delay:.8s} .d2{animation-delay:1.6s} .d3{animation-delay:2.4s}
.spin{animation:sp 9s linear infinite;transform-box:fill-box;transform-origin:center}
.float{animation:fl 6s ease-in-out infinite}
.blink{animation:bl 1.1s steps(1) infinite}
.eq{animation:eq 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
@keyframes tw{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes bl{50%{opacity:0}}
@keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FDE7F3"/><stop offset=".5" stop-color="#EBDDFF"/><stop offset="1" stop-color="#FFE3D3"/></linearGradient>
<linearGradient id="hl" x1="0" x2="1"><stop offset="0" stop-color="#E2408F"/><stop offset=".55" stop-color="#8A5CF6"/><stop offset="1" stop-color="#F28B5B"/></linearGradient>
<linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#E4D8FF"/><stop offset=".55" stop-color="#9C87D8"/><stop offset="1" stop-color="#F6E9FF"/></linearGradient>
<radialGradient id="b1"><stop offset="0" stop-color="#FF8FCB" stop-opacity=".75"/><stop offset="1" stop-color="#FF8FCB" stop-opacity="0"/></radialGradient>
<radialGradient id="b2"><stop offset="0" stop-color="#A88BFF" stop-opacity=".7"/><stop offset="1" stop-color="#A88BFF" stop-opacity="0"/></radialGradient>
<radialGradient id="b3"><stop offset="0" stop-color="#FFC27A" stop-opacity=".55"/><stop offset="1" stop-color="#FFC27A" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#8A5CF6" stroke-opacity="0"/></pattern>
<filter id="glow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8A5CF6" flood-opacity=".18"/></filter>
</defs><clipPath id="moldura"><rect width="1200" height="130" rx="26"/></clipPath><rect width="1200" height="130" rx="26" fill="url(#bg)"/><g clip-path="url(#moldura)"><circle cx="300" cy="130" r="200" fill="url(#b1)"/><circle cx="900" cy="0" r="200" fill="url(#b2)"/><circle cx="1150" cy="130" r="140" fill="url(#b3)"/><rect width="1200" height="130" fill="url(#grid)"/></g><rect x="1" y="1" width="1198" height="128" rx="25" fill="none" stroke="#FFFFFF" stroke-opacity="1" stroke-width="1.5"/><text x="600" y="62" text-anchor="middle" class="serif ink" font-size="28" font-style="italic">mesmos caminhos, novas possibilidades</text><text x="600" y="96" text-anchor="middle" class="mono" font-size="14" letter-spacing="4" fill="url(#hl)">PEOPLE · DATA · PURPOSE</text><path class="twinkle " d="M210 54 Q212.16 63.84 222 66 Q212.16 68.16 210 78 Q207.84 68.16 198 66 Q207.84 63.84 210 54Z" fill="url(#chrome)" stroke="#FFFFFF"/><path class="twinkle d1" d="M990 54 Q992.16 63.84 1002 66 Q992.16 68.16 990 78 Q987.84 68.16 978 66 Q987.84 63.84 990 54Z" fill="url(#chrome)" stroke="#FFFFFF"/><g transform="translate(1086 70) scale(0.62)"><path d="M0 40 L6 4 L24 20 Q40 14 56 20 L74 4 L80 40 Q80 62 40 62 Q0 62 0 40Z" fill="#2B1B3D"/><ellipse cx="26" cy="38" rx="6" ry="7" fill="#FFD36B"/><ellipse cx="54" cy="38" rx="6" ry="7" fill="#FFD36B"/><ellipse cx="26" cy="39" rx="2" ry="5" fill="#2B1B3D"/><ellipse cx="54" cy="39" rx="2" ry="5" fill="#2B1B3D"/><path d="M37 48 L40 51 L43 48Z" fill="#E2408F"/><path d="M16 50 H-6 M16 54 L-4 60 M64 50 H86 M64 54 L84 60" stroke="#8C7AA0" stroke-width="1.4"/></g></svg>
